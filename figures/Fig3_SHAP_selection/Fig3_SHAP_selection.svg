   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: middle" x="244.051654" y="26.902897" transform="rotate(-0 244.051654 26.902897)">SHAP-based feature selection process</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(45.432693 76.009592)">Step 1: Training inputs</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(84.279685 83.249202)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(40.496052 94.564827)">Define the 17-input space</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(49.577107 103.830491)">using the designated</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(56.42824 113.104124)">training records.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(195.082656 76.017561)">Step 2: Upstream attribution</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(243.36 83.249202)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(197.327852 94.556858)">Fit training standardization</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(201.336797 103.830491)">and quantile LightGBM;</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(194.366797 113.104124)">compute training TreeSHAP.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(204.761367 178.374317)">Step 3: Global ranking</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(243.36 185.613926)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(207.356523 196.921582)">Rank inputs by mean</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(208.811484 207.047872)">absolute SHAP over</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(209.25375 215.468848)">the training records.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(38.715701 178.382286)">Step 4: Select seven inputs</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(84.279685 185.613926)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(39.07363 197.780215)">Pass selected raw columns</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(47.691169 206.203184)">to supervised interval</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(54.423435 215.468848)">and rule learning.</text>
   </g>
