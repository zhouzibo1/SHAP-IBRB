   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: middle" x="255.11811" y="28.81068" transform="rotate(-0 255.11811 28.81068)">Detailed steps of evidential reasoning</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(68.863597 62.304995)">Step 1: Obtain attribute-level evidence</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(130.620472 69.111245)"/>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(52.965472 79.753745)">Continuous inputs: interpolate beliefs, reliability</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(57.762347 88.483745)">and weight between adjacent interval centers.</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(58.742972 97.209995)">Binary inputs: look up the matching interval.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(319.467623 62.297495)">Step 2: Weight and discount evidence</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(379.615748 69.111245)"/>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(322.186998 79.753745)">Use rule weights and rule reliability</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(330.966373 88.48187)">to form the weighted evidence</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(337.415123 98.01812)">for each selected attribute.</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(344.622623 139.770192)">Step 3: Fuse evidence</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(379.615748 146.576442)"/>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(323.528248 157.218942)">Aggregate the seven attribute-level</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(324.841998 165.947067)">belief distributions using ER-Rule</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(328.633873 175.483317)">and normalize the fused beliefs.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(77.523597 139.762692)">Step 4: Calculate expected utility</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(130.620472 146.576442)"/>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(89.894847 157.226442)">Set u(0) = 0 and u(1) = 1.</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(81.525472 165.947067)">The expected utility equals the</text>
    <text style="font-size: 8px; font-family: 'Times New Roman'" transform="translate(88.076097 174.682692)">fused positive-class belief.</text>
   </g>
  </g>
