   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: middle" x="392.065512" y="19.798616" transform="rotate(-0 392.065512 19.798616)">Core objective</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(116.688791 47.265621)">1. Training input</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(145.145197 54.505231)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(74.454416 65.820856)">Use each of the seven selected raw inputs</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(82.234572 75.08652)">and its corresponding training labels.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(344.941645 56.823884)">Build per-attribute intervals</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(357.598012 66.089549)">using training labels</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(104.665275 116.430976)">2. Candidate generation</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(145.145197 123.670585)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(64.413127 134.978241)">Sort distinct values in eligible current intervals;</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(70.910314 144.253866)">use adjacent-value midpoints as candidates.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(338.242582 125.989239)">Search distinct-value midpoints</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(346.155551 136.113536)">within the current intervals</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(100.534142 185.59633)">3. Greedy partition update</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(145.145197 192.835939)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(55.572462 204.143596)">Evaluate information gain for all eligible candidates.</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(69.679806 213.417229)">Insert the split with the largest positive gain.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(355.953793 195.146624)">Reduce label entropy</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(360.551098 204.420257)">with a greedy split</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(101.139103 254.769653)">4. Termination and output</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(145.145197 262.001294)"/>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(68.775353 273.30895)">Stop at 20 intervals or when no positive-gain</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(50.954572 282.582583)">eligible split remains. Return unique sorted boundaries.</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(321.010824 264.311979)">Control interval count; eligibility requires</text>
    <text style="font-size: 8.5px; font-family: 'Times New Roman'" transform="translate(322.559418 273.59358)">at least five records in the parent interval</text>
   </g>
  </g>
 </g>
